name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh public website data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-website-pages
  cancel-in-progress: false

jobs:
  deploy:
    # PAGES_ENABLED=true enables deployment from this public website repository.
    if: vars.PAGES_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R site _site/site
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
