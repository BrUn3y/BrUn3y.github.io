name: Refresh public website data

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-website-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Refresh public GitHub and published Strava data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_site_data.py --best-effort
      - name: Save updated public snapshots
        run: |
          git add site/activity.json site/strava.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public website activity snapshots'
            git push origin HEAD:main
          fi
